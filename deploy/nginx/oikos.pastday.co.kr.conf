# oikos.pastday.co.kr — Oikos University 경영대학원 홈페이지
#
# 이 파일은 이 서브도메인 전용이다.
# pastday.co.kr(sites-available/pastday), iychoi.pastday.co.kr(sites-available/iychoi),
# mission.pastday.co.kr(sites-available/mission) 설정과 완전히 분리되어 있으며
# 서로 영향을 주지 않는다.
#
# 최초 적용 시에는 80 포트만 열려 있고,
# certbot --nginx 가 이 server 블록에 TLS 설정과 HTTPS 리다이렉트를 추가한다.
#
# 설치:
#   sudo cp /home/pastday/oikos/deploy/nginx/oikos.pastday.co.kr.conf \
#           /etc/nginx/sites-available/oikos
#   sudo ln -s /etc/nginx/sites-available/oikos /etc/nginx/sites-enabled/oikos
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name oikos.pastday.co.kr;

    charset utf-8;

    access_log /var/log/nginx/oikos.access.log;
    error_log  /var/log/nginx/oikos.error.log;

    # 관리자 파일 업로드(8단계)를 대비해 넉넉히 잡아둔다.
    client_max_body_size 24m;

    # Next.js 애플리케이션 (systemd: oikos.service, 127.0.0.1:3100)
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        # 운영 모드의 Next.js 는 WebSocket 을 쓰지 않으므로
        # Upgrade/Connection 헤더 처리는 두지 않는다.
        # (http 블록에 map $connection_upgrade 를 추가해야 해서 기존 설정을 건드리게 된다)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 숨김 파일 차단 (.git, .env 등)
    # 단 /.well-known/ 은 예외로 둔다. Let's Encrypt 의 HTTP-01 인증이
    # /.well-known/acme-challenge/ 를 사용하므로 여기서 막으면 인증서 발급·갱신이 실패한다.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
